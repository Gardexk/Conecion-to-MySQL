<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRUD de productos</title>
    <link rel="stylesheet" href="estilos.css">
    <script defer src="main.js"></script>
</head>
<body>
    <main class="app">
        <section class="panel">
            <div class="panel__header">
                <h1>Productos</h1>
                <p>Proyecto de prueba para conectar PHP con MySQL.</p>
            </div>

            <form id="producto-form" class="formulario">
                <label for="idpro">Id producto</label>
                <input type="number" id="idpro" name="idpro" min="1" required>

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" maxlength="30" required>

                <label for="precio">Precio</label>
                <input type="number" id="precio" name="precio" min="0" step="0.01" required>

                <label for="existencia">Existencia</label>
                <input type="number" id="existencia" name="existencia" min="0" required>

                <div class="acciones">
                    <button type="submit">Registrar</button>
                    <button type="button" id="btn-consultar">Consultar</button>
                    <button type="button" id="btn-eliminar" class="button button--danger">Eliminar</button>
                    <button type="reset" class="button button--secondary">Limpiar</button>
                </div>
            </form>

            <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        </section>

        <section class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>#ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Existencia</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </section>
    </main>
</body>
</html>
